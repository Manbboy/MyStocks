name: cleanup
on:
  push:
    paths: [".github/workflows/cleanup.yml"]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: git init -q x && cd x && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete tinocal
