name: detick
on:
  push:
    paths: [".github/workflows/detick.yml"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/de_tickers.py --all
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/de_tickers.json; git commit -m "Tickers allemands (pré-ouverture) recalculés"; git pull --rebase; git push
