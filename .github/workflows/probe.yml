name: Test symboles
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in fdax.f fx.f fce.f fesx.f dax.f ^dax es.f; do echo "STQ $s: $(curl -s "https://stooq.com/q/l/?s=$s&f=sd2t2ohlcv&h&e=csv" | tail -1)"; done
          for s in FDAX1! ; do :; done
          echo "CNBC: $(curl -s 'https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=@DX.1|@SX5E.1|@FCE.1&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json' | head -c 1500)"
