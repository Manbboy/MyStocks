name: Mise à jour des cours

on:
  schedule:
    # Heures en UTC, du lundi au vendredi
    - cron: "50 16 * * 1-5"   # après la clôture européenne (17h50 à Bruxelles en hiver)
    - cron: "40 21 * * 1-5"   # après la clôture américaine (22h40 à Bruxelles en hiver)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    paths:
      - portfolios.json       # relance dès que tu modifies tes portefeuilles

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install yfinance pandas numpy lxml

      - name: Télécharger les cours et calculer les niveaux
        run: python scripts/update.py

      # momentum : Top 10 sur 6 mois (onglet À regarder)
      - name: Momentum
        run: python scripts/momentum.py

      # meilleures confluences Manu sur toutes les listes (onglet À regarder)
      - name: Confluences Manu
        run: node scripts/manu_list.mjs

      # indicateur Biarritz sur toutes les listes (accueil et Signaux de la nouvelle interface)
      - name: Biarritz
        run: node scripts/bia_list.mjs

      # mini-graphiques des listes (nouvelle interface)
      - name: Mini-graphiques
        run: node scripts/sparks.mjs

      # bascules R⇄S pour l'onglet « À regarder » : calculées avec le code de l'appli (index.html)
      - name: Bascules R⇄S (À regarder)
        run: node scripts/flip_signals.mjs

      # journal des approches (zones, supports / résistances, Biarritz) : 10 séances d'historique pour la page Aujourd'hui
      - name: Journal des approches (Aujourd'hui)
        run: node scripts/approach_log.mjs

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des cours"
          git pull --rebase
          git push

      # alertes R⇄S automatiques : écrites dans alerts.json (lu toutes les 5 minutes par le relais Telegram)
      - name: Alertes R⇄S automatiques (Telegram)
        run: |
          git pull --rebase
          node scripts/flip_alerts.mjs
          git add alerts.json
          git diff --cached --quiet || git commit -m "Alertes R⇄S automatiques"
          git pull --rebase
          git push
