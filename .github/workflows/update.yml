name: Mise à jour des cours

on:
  schedule:
    # Heures en UTC, du lundi au vendredi
    - cron: "50 16 * * 1-5"   # après la clôture européenne (17h50 à Bruxelles en hiver)
    - cron: "40 21 * * 1-5"   # après la clôture américaine (22h40 à Bruxelles en hiver)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    paths:
      - portfolios.json       # relance dès que tu modifies tes portefeuilles

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install yfinance pandas numpy

      - name: Télécharger les cours et calculer les niveaux
        run: python scripts/update.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des cours"
          git pull --rebase
          git push
