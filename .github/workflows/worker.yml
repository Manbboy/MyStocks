# Déploie automatiquement le relais Cloudflare « cours-live » (dossier worker/) à chaque modification.
# Nécessite deux secrets GitHub (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN  : jeton Cloudflare « Edit Cloudflare Workers »
#   CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare
# Le jeton Telegram reste un secret Cloudflare (TG_TOKEN) : le déploiement ne le touche pas.
name: Relais Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : déploiement sauté"; fi
      - name: Déployer cours-live
        if: steps.chk.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
